apply plugin: 'com.android.application'

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

def resolveGitHash() {
    try {
        def hash = providers.exec {
            commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
        }.standardOutput.asText.get().trim().toUpperCase(java.util.Locale.US)
        return (hash ==~ /[0-9A-F]{8}/) ? "0x${hash}" : "0x00000000"
    } catch (Exception ignored) {
        return "0x00000000"
    }
}

android {
    compileSdkVersion 36
    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "GIT_HASH", "\"${resolveGitHash()}\""
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        buildConfig = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    flavorDimensions "version"
    productFlavors {
        hptoy {
            versionCode 35
            versionName "1.8.1"
            dimension "version"
            applicationId "com.hptoy"
        }
    }
    lint {
        checkReleaseBuilds = false
    }
    namespace = 'com.hifitoy'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.core:core:1.10.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
